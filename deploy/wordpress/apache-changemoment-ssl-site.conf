<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName changemoment.ca
    DocumentRoot /srv/changemoment/current

    ErrorLog ${APACHE_LOG_DIR}/changemoment-error.log
    CustomLog ${APACHE_LOG_DIR}/changemoment-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/changemoment.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/changemoment.ca/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName www.changemoment.ca

    ErrorLog ${APACHE_LOG_DIR}/changemoment-error.log
    CustomLog ${APACHE_LOG_DIR}/changemoment-access.log combined

    Redirect permanent / https://changemoment.ca/

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/changemoment.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/changemoment.ca/privkey.pem
</VirtualHost>
</IfModule>

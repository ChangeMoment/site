ServerName changemoment.ca
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Alias /cms /var/www/cms

<Directory /var/www/cms>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # ChangeMoment uses the REST API and wp-admin, not legacy XML-RPC.
    <Files "xmlrpc.php">
        Require all denied
    </Files>
</Directory>

<Directory /srv/changemoment/current>
    Options -Indexes +FollowSymLinks
    DirectorySlash Off
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteCond %{REQUEST_FILENAME}/index.html -f
    RewriteRule ^(.+?)/?$ /$1/index.html [END]
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ - [R=404,L]
</Directory>

ErrorDocument 404 /404.html

# Self-hosted Persian webfonts (Doran, Pinar) are served from /fonts and never
# change without a filename change, so they can be cached for a year.
AddType font/woff2 .woff2
<LocationMatch "^/fonts/.*\.woff2$">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

<LocationMatch "^/cms/(wp-config\.php|readme\.html|license\.txt)">
    Require all denied
</LocationMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000"

# Keep the public application locked down while avoiding a false/broken CSP on
# the authenticated WordPress and Rank Math interfaces. WordPress plugins emit
# runtime inline scripts that cannot be safely enumerated as static hashes.
<LocationMatch "^/(?!cms(?:/|$))">
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://changemoment.janeapp.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.google.com https://maps.google.com"
</LocationMatch>
<LocationMatch "^/cms(?:/|$)">
    Header always unset Content-Security-Policy
</LocationMatch>
